[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vozclave"
version = "0.1.0"
description = "Offline voice commands for your desktop that only obey your voice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Diego Mahecha Martinez" }]
requires-python = ">=3.11"
keywords = ["voice", "speech-recognition", "speaker-verification", "vosk", "speechbrain", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Environment :: Console",
]
dependencies = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
voiceid = ["torch>=2.2", "torchaudio>=2.2", "speechbrain>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vozclave = "vozclave.cli:main"

[project.urls]
Repository = "https://github.com/jdmahecha1/vozclave"

[tool.hatch.build.targets.wheel]
packages = ["src/vozclave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
